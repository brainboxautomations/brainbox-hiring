version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_|RESEND_|AUTOMATION_|EMAIL_|COMPANY_|APP_|TURNSTILE_|R2_)' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
